name: Generate Project Explanation PDF

on:
  push:
    branches: [main]
    paths:
      - "docs/project-explanation.md"
      - "scripts/generate_project_explanation.py"
      - ".github/workflows/generate-project-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF dependency
        run: python -m pip install --upgrade pip reportlab
      - name: Generate guide
        run: python scripts/generate_project_explanation.py
      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/project-explanation.pdf
          git commit -m "Add generated project explanation PDF" || echo "No PDF changes to commit"
          git push
